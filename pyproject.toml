[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-rightsizer-report"
version = "0.2.1"
description = "metrics-server/VPA data to PR-ready requests/limits diffs"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Fabio Cicerchia" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/fabiocicerchia/k8s-rightsizer-report"
Issues = "https://github.com/fabiocicerchia/k8s-rightsizer-report/issues"
Changelog = "https://github.com/fabiocicerchia/k8s-rightsizer-report/blob/main/CHANGELOG.md"

[project.scripts]
k8s-rightsizer-report = "k8s_rightsizer_report:main"

[tool.setuptools]
py-modules = ["k8s_rightsizer_report"]

[tool.pytest.ini_options]
# Without this pytest imports whatever k8s_rightsizer_report an editable
# install points at, not the checkout under test — a stale one turns the suite
# green (or red) on code nobody is editing.
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# The en dash in the report is deliberate typography, not a mistyped hyphen.
allowed-confusables = ["–"]
select = [
  "E", "W", "F", "I", "N", "UP", "ANN", "ASYNC", "S", "B", "A", "C4", "DTZ",
  "T20", "PT", "RET", "SIM", "PTH", "ERA", "TD", "FIX", "PLR2004", "TRY", "PL", "RUF",
]
ignore = [
  "ANN401",      # Any in *args/**kwargs — FC-GEN-016's comment rule covers it
  "TRY003",      # long messages inline; FC-GEN-022 wants them descriptive
]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
# `assert` is what a test is, and an expected value is the literal it compares
# against -- naming it moves the assertion one step from the thing asserted.
"tests/**" = [
  "S101",     # `assert` is what a test is
  "PLR2004",  # an expected value is the literal it compares against
  "ANN001",   # a fixture or a fake's argument, named by the test that builds it
]
