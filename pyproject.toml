[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-rightsizer-report"
version = "0.2.1"
description = "metrics-server/VPA data to PR-ready requests/limits diffs"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Fabio Cicerchia" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/fabiocicerchia/k8s-rightsizer-report"
Issues = "https://github.com/fabiocicerchia/k8s-rightsizer-report/issues"
Changelog = "https://github.com/fabiocicerchia/k8s-rightsizer-report/blob/main/CHANGELOG.md"

[project.scripts]
k8s-rightsizer-report = "k8s_rightsizer_report:main"

[tool.setuptools]
py-modules = ["k8s_rightsizer_report"]

[tool.ruff]
line-length = 100
