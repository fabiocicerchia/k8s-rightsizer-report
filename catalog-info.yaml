# Backstage catalog entry, read by paved's scorecard plugin.
#
# Every check paved scores is derived from this file alone — no cluster
# access, no CI credentials. What is absent here is absent from the score.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: k8s-rightsizer-report
  description: >-
      Generates right-sizing recommendations from Kubernetes metrics-server data, outputting a human-
      readable report or patch YAML ready to commit.
  annotations:
    github.com/project-slug: fabiocicerchia/k8s-rightsizer-report
    backstage.io/source-location: url:https://github.com/fabiocicerchia/k8s-rightsizer-report/
    backstage.io/techdocs-ref: dir:.
  links:
    - url: https://github.com/fabiocicerchia/k8s-rightsizer-report
      title: Source
spec:
  type: library
  lifecycle: production
  owner: group:default/kodebeat
  system: oss-tools
