name: rightsizer-report auto-PR

# Drop this in a consuming repo's .github/workflows/ to run KRR weekly, record
# the run in a committed history directory, and open a PR with the
# recommendations that have held still for three runs. Needs cluster access and
# a Prometheus reachable by krr (kubeconfig via a secret, OIDC, whatever this
# repo already uses) — that part is intentionally left to the consuming repo,
# it's too environment-specific to template here.

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      namespace:
        description: "Namespace to size"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install k8s-rightsizer-report krr
      - name: Propose what has settled, and open the PR
        env:
          # Passed through an env var, not interpolated into the script — a
          # malicious workflow_dispatch namespace value (this job holds
          # contents:write/pull-requests:write) can't inject shell commands.
          NAMESPACE: ${{ inputs.namespace || 'default' }}
          PROMETHEUS: ${{ vars.PROMETHEUS_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Records this run in .rightsizer/history/, commits it with the
          # patches, and opens the PR. Nothing to open is a no-op, not a
          # failure: on most weeks nothing new has settled.
          k8s-rightsizer-report -n "$NAMESPACE" \
            --krr-arg -p --krr-arg "$PROMETHEUS" \
            --pr
      - name: Keep the history even when there was no PR to open
        run: |
          set -e
          # A run that proposes nothing still belongs in the history — it is one
          # of the runs a later recommendation will claim to have been stable
          # across.
          if ! git diff --quiet -- .rightsizer/history; then
            git add .rightsizer/history
            git commit -m "chore(rightsizing): record run"
            git push origin HEAD:"${{ github.event.repository.default_branch }}"
          fi
