name: rightsizer-report auto-PR

# Drop this in a consuming repo's .github/workflows/ to get a weekly PR with
# the latest rightsizing patch YAML, ready to review and merge. Needs cluster
# access configured on the runner (kubeconfig via a secret, OIDC, whatever
# this repo already uses to reach the cluster) — that part is intentionally
# left to the consuming repo, it's too environment-specific to template here.

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      namespace:
        description: "Namespace to size"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install k8s-rightsizer-report
      - name: Generate the patch
        run: |
          k8s-rightsizer-report -n "${{ inputs.namespace || 'default' }}" --diff \
            > rightsizing-patch.yaml
      - name: Open a PR if the patch changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if git diff --quiet -- rightsizing-patch.yaml; then
            echo "no rightsizing changes"
            exit 0
          fi
          branch="rightsizer-report/$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add rightsizing-patch.yaml
          git commit -m "chore: update rightsizing recommendations"
          git push origin "$branch"
          gh pr create --title "Rightsizing recommendations $(date -u +%Y-%m-%d)" \
            --body "Auto-generated by k8s-rightsizer-report. Review the diff before merging." \
            --base "${{ github.event.repository.default_branch }}" --head "$branch"
